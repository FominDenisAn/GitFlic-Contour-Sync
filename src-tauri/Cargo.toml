[package]
name = "gitflic-contour-sync"
version = "0.3.0"
description = "Local desktop application for comparing GitFlic contours and safely synchronizing selected branches via an existing GitFlic runner"
authors = ["internal"]
edition = "2021"

[lib]
name = "gitflic_contour_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
url = "2"

tokio = { version = "1", features = ["time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
